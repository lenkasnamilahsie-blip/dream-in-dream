<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1d"><meta name="description" content="Súkromný offline denník snov v slovenčine."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png" type="image/png"><title>Dream in Dream</title>
<style>
:root{color-scheme:dark;--bg:#090d1d;--panel:#121a31;--panel2:#192341;--line:#2b3659;--text:#edf1ff;--muted:#a4aecb;--accent:#b8a5ff;--accent2:#8d7cf0;--danger:#ff879b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182348 0%,var(--bg) 52%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:11px 14px;cursor:pointer}button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:650}button.danger{color:var(--danger)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,textarea{width:100%;background:#0d1429;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:180px;resize:vertical}.app{max-width:760px;margin:auto;padding:18px 15px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 20px}.brand{display:flex;align-items:center;gap:12px}.moon{font-size:30px}.brand h1{font-size:21px;line-height:1.15;margin:0}.brand p{color:var(--muted);margin:3px 0 0;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:17px}.tabs button{white-space:nowrap}.tabs button.active{background:var(--accent);color:#11152a;border-color:var(--accent);font-weight:700}.card{background:linear-gradient(145deg,rgba(24,34,64,.96),rgba(16,23,44,.96));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px #0002}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.h2{font-size:22px;margin:4px 0 12px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.field{margin:13px 0}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.entry{padding:14px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry h3{margin:0 0 4px;font-size:17px}.entry p{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:calc(1rem * var(--reading-scale,1));line-height:1.65}.entrytop{display:flex;gap:10px;justify-content:space-between;align-items:start}.entrytop button{padding:7px 10px}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.empty .big{font-size:34px}.hidden{display:none!important}.foot{color:#7f8aaa;font-size:12px;text-align:center;padding:18px 0}.notice{border:1px solid #7669c9;background:#24234a;border-radius:12px;padding:11px;margin-bottom:12px;font-size:13px}.pinwrap{min-height:100dvh;display:grid;place-items:center;padding:20px}.pinbox{max-width:390px;width:100%;text-align:center}.pinbox h1{font-size:28px}.pinbox input{text-align:center;letter-spacing:.3em;font-size:22px}.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}.monthnav strong{font-size:18px}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:13px}.daygrid span,.daygrid button{padding:8px 0;text-align:center;border-radius:9px;min-width:0}.daygrid span{font-size:12px;color:var(--muted)}.daygrid button{padding:7px 0}.daygrid button.has{border-color:var(--accent);box-shadow:inset 0 -3px var(--accent)}.daygrid button.selected{background:var(--accent);color:#10152b}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.sectiontitle h2{margin:0;font-size:20px}@media(min-width:600px){.app{padding-top:28px}.card{padding:22px}}
@media print{body{background:white;color:#111}.app,.card{background:white;color:#111;box-shadow:none;border-color:#ddd}.no-print{display:none!important}.entry p,.muted,.small{color:#333}.entry{break-inside:avoid}.print-only{display:block!important}}
</style></head><body>
<div id="lockScreen" class="pinwrap hidden"><div class="pinbox card"><div style="font-size:44px">🌙</div><h1>Dream in Dream</h1><p class="muted" id="pinMessage">Zadaj PIN na odomknutie denníka.</p><form id="unlockForm"><input id="unlockPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" required autocomplete="current-password"><div style="height:12px"></div><button class="primary" style="width:100%">Odomknúť</button></form><p id="pinError" class="small"></p></div></div>
<div id="app" class="app hidden">
<header class="top"><div class="brand"><div class="moon">🌙</div><div><h1>Dream in Dream</h1><p>Tvoj súkromný denník snov</p></div></div><button id="settingsBtn" aria-label="Nastavenia">⚙</button></header>
<nav class="tabs no-print"><button class="active" data-tab="home">Dnes</button><button data-tab="archive">Archív</button><button data-tab="search">Hľadať</button><button data-tab="backup">Export a záloha</button></nav>
<main id="view"></main><div class="foot">Offline denník · Tvoje sny zostávajú v tomto zariadení</div></div>
<script>
(()=>{'use strict';const KEY='did_dreams_v1', PINKEY='did_pin_v1', LOCKKEY='did_lock_v1', FONTKEY='did_font_size_v1';let dreams=[],tab='home',editId=null,selectedDate=localDate(),calendarMonth=new Date();const $=id=>document.getElementById(id),view=$('view');function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{dreams=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(dreams))dreams=[]}catch{dreams=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(dreams))}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'})}function sort(){return [...dreams].sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt)}function short(s,n=140){return s.length>n?s.slice(0,n)+'…':s}function entryHTML(d){return `<article class="entry"><div class="entrytop"><div style="min-width:0;flex:1"><div class="small">${fmt(d.date)}</div><h3>${esc(d.title||'Sen bez názvu')}</h3><p>${esc(short(d.body))}</p></div><div class="actions" style="flex:0 0 auto;flex-direction:column"><button data-edit="${d.id}">Upraviť</button><button class="danger" data-delete="${d.id}">Zmazať</button></div></div></article>`}function listHTML(items,empty='Zatiaľ tu nemáš žiadne sny.'){return items.length?items.map(entryHTML).join(''):`<div class="empty"><div class="big">☾</div>${empty}</div>`}function applyFontSize(){const sizes={small:'0.88',normal:'1',large:'1.18',extra:'1.38'};document.documentElement.style.setProperty('--reading-scale',sizes[localStorage.getItem(FONTKEY)||'normal']||'1')}function render(){applyFontSize();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='archive')archive();if(tab==='search')search();if(tab==='backup')backup();if(tab==='settings')settings();bindEntries()}function home(){const today=sort().filter(d=>d.date===localDate());view.innerHTML=`<section class="card"><div class="eyebrow">Dnešný zápis</div><h2 class="h2">${fmt(localDate())}</h2><p class="muted">Zachyť svoje sny, kým sú ešte čerstvé.</p><button class="primary" id="addDream">＋ Pridať sen</button></section><section class="card"><div class="sectiontitle"><h2>Dnešné sny</h2><span class="small">${today.length} ${today.length===1?'sen':'snov'}</span></div>${listHTML(today,'Dnes ešte nemáš zapísaný žiadny sen.')}</section><section class="card"><div class="sectiontitle"><h2>Posledné sny</h2><button data-gotab="archive">Celý archív →</button></div>${listHTML(sort().filter(d=>d.date!==localDate()).slice(0,3),'Staršie sny sa zobrazia tu.')}</section>`}function formHTML(d={date:selectedDate,title:'',body:''}){return `<section class="card"><div class="sectiontitle"><h2>${editId?'Upraviť sen':'Nový sen'}</h2><button id="cancelEdit">Zavrieť</button></div><form id="dreamForm"><div class="field"><label for="dreamDate">Dátum sna</label><input id="dreamDate" type="date" value="${esc(d.date)}" required></div><div class="field"><label for="dreamTitle">Názov (nepovinné)</label><input id="dreamTitle" maxlength="120" value="${esc(d.title||'')}" placeholder="Napr. Lietanie nad mestom"></div><div class="field"><label for="dreamBody">Čo sa ti snívalo?</label><textarea id="dreamBody" required placeholder="Zapíš si všetko, čo si pamätáš…">${esc(d.body||'')}</textarea></div><button class="primary" style="width:100%">Uložiť sen</button></form></section>`}function openForm(id=null){editId=id;const d=id?dreams.find(x=>x.id===id):{date:tab==='archive'?selectedDate:localDate(),title:'',body:''};view.innerHTML=formHTML(d||{});$('cancelEdit').onclick=()=>render();$('dreamForm').onsubmit=e=>{e.preventDefault();const date=$('dreamDate').value,title=$('dreamTitle').value.trim(),body=$('dreamBody').value.trim();if(!body)return;const now=Date.now();if(editId){const i=dreams.findIndex(x=>x.id===editId);if(i>=0)dreams[i]={...dreams[i],date,title,body,updatedAt:now}}else dreams.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),date,title,body,createdAt:now,updatedAt:now});save();editId=null;tab='home';render()}}function archive(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,has=new Set(dreams.map(d=>d.date));let cells='';['Po','Ut','St','Št','Pi','So','Ne'].forEach(x=>cells+=`<span>${x}</span>`);for(let i=0;i<offset;i++)cells+='<span></span>';for(let day=1;day<=days;day++){const dt=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;cells+=`<button class="${has.has(dt)?'has':''} ${dt===selectedDate?'selected':''}" data-date="${dt}">${day}</button>`}const items=sort().filter(d=>d.date===selectedDate);view.innerHTML=`<section class="card"><div class="monthnav"><button id="prevMonth">‹</button><strong>${new Date(y,m,1).toLocaleDateString('sk-SK',{month:'long',year:'numeric'})}</strong><button id="nextMonth">›</button></div><div class="daygrid">${cells}</div><p class="small">Dni s označením obsahujú aspoň jeden sen.</p></section><section class="card"><div class="sectiontitle"><div><div class="eyebrow">Vybraný deň</div><h2>${fmt(selectedDate)}</h2></div><button class="primary" id="addDream">＋ Sen</button></div>${listHTML(items,'Na tento deň nie je zapísaný žiadny sen.')}</section>`;$('prevMonth').onclick=()=>{calendarMonth=new Date(y,m-1,1);render()};$('nextMonth').onclick=()=>{calendarMonth=new Date(y,m+1,1);render()};view.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});$('addDream').onclick=()=>openForm()}function search(){view.innerHTML=`<section class="card"><div class="eyebrow">Archív v texte</div><h2 class="h2">Vyhľadať sen</h2><div class="field"><input id="query" placeholder="Hľadaj slovo alebo frázu…" autocomplete="off"></div><div class="row"><div class="field"><label>Od dátumu</label><input id="fromDate" type="date"></div><div class="field"><label>Do dátumu</label><input id="toDate" type="date"></div></div><div id="results"></div></section>`;const run=()=>{const q=$('query').value.trim().toLocaleLowerCase('sk'),from=$('fromDate').value,to=$('toDate').value;const found=sort().filter(d=>(!q||(d.title+' '+d.body).toLocaleLowerCase('sk').includes(q))&&(!from||d.date>=from)&&(!to||d.date<=to));$('results').innerHTML=`<div class="small">Nájdených snov: ${found.length}</div>${listHTML(found,'Nenašli sa žiadne sny.')}`;bindEntries()};['query','fromDate','toDate'].forEach(id=>$(id).addEventListener('input',run));run()}function backup(){view.innerHTML=`<section class="card"><div class="eyebrow">Tvoje dáta</div><h2 class="h2">Export a záloha</h2><p class="muted">Všetko zostáva v tomto zariadení. Pravidelná záloha ťa ochráni pri strate alebo výmene telefónu.</p><div class="notice">PDF je určené na čítanie a tlač. Súbor JSON obsahuje všetky údaje a možno ho neskôr obnoviť.</div><div class="actions"><button class="primary" id="pdfAll">Exportovať denník do PDF</button><button id="jsonOut">Stiahnuť zálohu JSON</button></div><div class="field"><label for="jsonIn">Obnoviť alebo importovať zálohu JSON</label><input type="file" id="jsonIn" accept=".json,application/json"></div><p class="small">Pri importe sa sny zlúčia podľa identifikátora; existujúce záznamy sa nevymažú.</p><div class="field"><button class="danger" id="deleteAll">Vymazať všetky sny</button></div><p class="small">Počet uložených snov: ${dreams.length}</p></section>`;$('pdfAll').onclick=pdf;$('jsonOut').onclick=exportJSON;$('jsonIn').onchange=importJSON;$('deleteAll').onclick=()=>{if(confirm('Naozaj chceš natrvalo vymazať všetky sny? Túto akciu nemožno vrátiť späť.')){dreams=[];save();render()}}}function pdf(){const items=sort();const w=window.open('','_blank');if(!w){alert('Prehliadač zablokoval okno. Povoľ vyskakovacie okná a skús znova.');return}w.document.write(`<!doctype html><html lang="sk"><head><meta charset="utf-8"><title>Dream in Dream – export</title><style>body{font:14px/1.6 Arial,sans-serif;max-width:760px;margin:40px auto;color:#182039}h1{font-size:26px}h2{font-size:19px;margin-bottom:4px}.date{color:#666;font-size:12px}.dream{border-bottom:1px solid #ddd;padding:12px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{body{margin:15mm}}</style></head><body><h1>Dream in Dream – Denník snov</h1><p>Exportované: ${esc(new Date().toLocaleString('sk-SK'))}</p><p>Počet snov: ${items.length}</p>${items.length?items.map(d=>`<article class="dream"><div class="date">${fmt(d.date)}</div><h2>${esc(d.title||'Sen bez názvu')}</h2><p>${esc(d.body)}</p></article>`).join(''):'<p>V denníku zatiaľ nie sú žiadne sny.</p>'}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJSON(){download('dream-in-dream-zaloha-'+localDate()+'.json',JSON.stringify({format:'dream-in-dream-backup',version:1,exportedAt:new Date().toISOString(),dreams},null,2),'application/json')}async function importJSON(e){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data.dreams;if(!Array.isArray(arr))throw Error('Súbor neobsahuje zoznam snov.');let count=0;for(const d of arr){if(!d||typeof d.body!=='string'||typeof d.date!=='string')continue;const id=String(d.id||Date.now()+'-'+Math.random());const old=dreams.findIndex(x=>x.id===id);const clean={id,date:d.date,title:String(d.title||''),body:d.body,createdAt:Number(d.createdAt)||Date.now(),updatedAt:Number(d.updatedAt)||Date.now()};if(old>=0)dreams[old]=clean;else dreams.push(clean);count++}save();alert('Importované/obnovené záznamy: '+count);render()}catch(err){alert('Zálohu sa nepodarilo načítať: '+err.message)}e.target.value=''}function settings(){const enabled=!!localStorage.getItem(PINKEY),font=localStorage.getItem(FONTKEY)||'normal';view.innerHTML=`<section class="card"><div class="eyebrow">Súkromie</div><h2 class="h2">Nastavenia PIN</h2><p class="muted">PIN chráni otvorenie denníka na tomto zariadení. Nejde o šifrovanie súborov ani záloh.</p>${enabled?'<p>PIN je zapnutý.</p><button class="danger" id="removePin">Vypnúť PIN</button>':'<p>PIN je vypnutý.</p>'}<div class="field"><label for="newPin">${enabled?'Zmeniť PIN':'Nastaviť PIN (4 až 8 číslic)'}</label><input id="newPin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="4 až 8 číslic"></div><div class="field"><label for="confirmPin">Potvrdiť PIN</label><input id="confirmPin" type="password" inputmode="numeric" maxlength="8" placeholder="Zadaj PIN znova"></div><button class="primary" id="savePin">${enabled?'Zmeniť PIN':'Zapnúť PIN'}</button><p id="settingsMsg" class="small"></p></section><section class="card"><div class="eyebrow">Prístupnosť</div><h2 class="h2">Vzhľad a čítanie</h2><div class="field"><label for="fontSize">Veľkosť písma pri čítaní snov</label><select id="fontSize" style="width:100%;background:#0d1429;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit"><option value="small" ${font==='small'?'selected':''}>Malé</option><option value="normal" ${font==='normal'?'selected':''}>Normálne</option><option value="large" ${font==='large'?'selected':''}>Veľké</option><option value="extra" ${font==='extra'?'selected':''}>Extra veľké</option></select></div><div class="notice"><strong>Ukážka textu</strong><p id="fontPreview" style="font-size:calc(1rem * var(--reading-scale,1));line-height:1.6;margin:6px 0 0">Letel som nad nočným mestom a podo mnou žiarili tisíce svetiel.</p></div></section><section class="card"><h2 class="h2">O aplikácii</h2><p class="muted">Dream in Dream · offline denník snov</p><p class="small">Záznamy sa ukladajú lokálne v prehliadači/aplikácii. Pravidelne exportuj JSON zálohu.</p></section>`;$('fontSize').onchange=()=>{localStorage.setItem(FONTKEY,$('fontSize').value);applyFontSize()};$('savePin').onclick=()=>{const p=$('newPin').value,c=$('confirmPin').value;if(!/^\d{4,8}$/.test(p)||p!==c){$('settingsMsg').textContent='PIN musí mať 4–8 číslic a obe hodnoty sa musia zhodovať.';return}localStorage.setItem(PINKEY,p);$('settingsMsg').textContent='PIN bol uložený.';setTimeout(()=>{tab='home';render()},650)};if(enabled)$('removePin').onclick=()=>{if(confirm('Vypnúť ochranu PIN?')){localStorage.removeItem(PINKEY);tab='settings';render()}}}function bindEntries(){view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const d=dreams.find(x=>x.id===b.dataset.delete);if(d&&confirm(`Zmazať sen „${d.title||'Sen bez názvu'}“?`)){dreams=dreams.filter(x=>x.id!==d.id);save();render()}});view.querySelectorAll('[data-gotab]').forEach(b=>b.onclick=()=>{tab=b.dataset.gotab;render()})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editId=null;render()});$('settingsBtn').onclick=()=>{tab='settings';render()};view.addEventListener('click',e=>{if(e.target.id==='addDream')openForm();if(e.target.matches('[data-edit],[data-delete],[data-gotab]'))return;});$('unlockForm').onsubmit=e=>{e.preventDefault();if($('unlockPin').value===localStorage.getItem(PINKEY)){sessionStorage.setItem(LOCKKEY,'yes');$('lockScreen').classList.add('hidden');$('app').classList.remove('hidden');$('pinError').textContent='';render()}else{$('pinError').textContent='Nesprávny PIN.';$('unlockPin').value=''}};load();if(localStorage.getItem(PINKEY)&&sessionStorage.getItem(LOCKKEY)!=='yes'){$('lockScreen').classList.remove('hidden');$('pinMessage').textContent='Zadaj PIN na odomknutie denníka.'}else{$('app').classList.remove('hidden');render()}
// Save drafts when leaving the page is not needed; each entry is saved explicitly. Keep the app self-contained and offline.
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {}));
})();
</script></body></html>
